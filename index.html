<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario del Precursor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fas fa-calendar-alt"></i> Calendario del Precursor</h1>
            <div class="user-info">
                <span id="current-month">Mes Actual</span>
            </div>
        </header>

        <section class="control-panel">
            <div class="config-section">
                <h3><i class="fas fa-cog"></i> Configuración Mensual</h3>
                <div class="config-grid">
                    <div class="config-item">
                        <label for="precursor-type">Tipo de Precursorado:</label>
                        <select id="precursor-type">
                            <option value="15">Auxiliar - 15 horas</option>
                            <option value="30">Auxiliar - 30 horas</option>
                            <option value="50" selected>Regular - 50 horas</option>
                            <option value="100">Especial - 100 horas</option>
                            <option value="custom">Personalizado</option>
                        </select>
                    </div>
                    <div class="config-item" id="custom-hours-container" style="display: none;">
                        <label for="custom-hours">Horas Personalizadas:</label>
                        <input type="number" id="custom-hours" min="1" max="200" value="50">
                    </div>
                    <div class="config-item">
                        <button id="save-config" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Configuración
                        </button>
                    </div>
                </div>
            </div>

            <div class="summary-section">
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="card-icon"><i class="fas fa-bullseye"></i></div>
                        <div class="card-content">
                            <h4>Meta Mensual</h4>
                            <span id="monthly-goal">50</span> horas
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="card-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="card-content">
                            <h4>Horas Realizadas</h4>
                            <span id="hours-done">0</span> horas
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="card-icon"><i class="fas fa-clock"></i></div>
                        <div class="card-content">
                            <h4>Horas Restantes</h4>
                            <span id="hours-remaining">50</span> horas
                        </div>
                    </div>
                    <div class="summary-card">
                        <div class="card-icon"><i class="fas fa-chart-line"></i></div>
                        <div class="card-content">
                            <h4>Progreso</h4>
                            <span id="progress-percent">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="month-navigation">
            <button id="prev-month" class="btn btn-secondary">
                <i class="fas fa-chevron-left"></i> Anterior
            </button>
            <h2 id="current-month-display">Cargando...</h2>
            <button id="next-month" class="btn btn-secondary">
                Siguiente <i class="fas fa-chevron-right"></i>
            </button>
        </section>

        <section class="calendar-section">
            <div class="calendar-header">
                <div class="day-header">Lun</div><div class="day-header">Mar</div>
                <div class="day-header">Mié</div><div class="day-header">Jue</div>
                <div class="day-header">Vie</div><div class="day-header">Sáb</div>
                <div class="day-header">Dom</div>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                <!-- Calendario se genera aquí -->
            </div>
        </section>

        <div id="hours-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Registrar Horas</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="selected-date">
                        <i class="fas fa-calendar-day"></i>
                        <span id="modal-date">Fecha</span>
                    </div>
                    <div class="hours-input">
                        <label for="hours-count">Horas:</label>
                        <input type="number" id="hours-count" min="0" max="12" step="0.5" value="1">
                    </div>
                    <div class="notes-input">
                        <label for="hours-notes">Notas:</label>
                        <textarea id="hours-notes" placeholder="Actividades..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="delete-hours" class="btn btn-danger" style="display: none;">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                    <button id="save-hours" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="Vstorage.js"></script>
    <script src="Xcalendario.js"></script>
    <script src="zAPP.js"></script>

    <!-- SCRIPT DE DEPURACIÓN -->
    <script>
        console.log('=== INICIANDO DEPURACIÓN ===');
        
        // Verificar que los archivos se cargaron
        setTimeout(() => {
            console.log('StorageManager:', typeof StorageManager);
            console.log('Calendar:', typeof Calendar);
            console.log('PrecursorApp:', typeof PrecursorApp);
            
            // Verificar que los elementos del DOM existen
            console.log('save-config button:', document.getElementById('save-config'));
            console.log('precursor-type select:', document.getElementById('precursor-type'));
        }, 100);
    </script>
</body>
</html>
<!-- Modal de Configuración -->
<div id="modalConfiguracion" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <h2>Configuración de Estudio</h2>
        
        <div class="form-group">
            <label for="metaInput">Meta de estudio (horas):</label>
            <input type="number" id="metaInput" step="0.01" min="0.01" placeholder="Ej: 100">
        </div>
        
        <div class="form-group">
            <label for="horasRestantesInput">Horas restantes:</label>
            <input type="number" id="horasRestantesInput" step="0.01" min="0" placeholder="Ej: 75.5">
        </div>
        
        <button onclick="guardarConfiguracion()" class="btn-guardar">Guardar Configuración</button>
    </div>
</div>
